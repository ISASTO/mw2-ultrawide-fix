name: Build Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Test
        run: go test ./...

      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-H windowsgui -s -w" -o MW2-Ultrawide-Fix.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: MW2-Ultrawide-Fix
          path: MW2-Ultrawide-Fix.exe

      - name: Publish v1.0.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: MW2 Ultrawide Fix v1.0.0
          body: |
            Simple GUI ultrawide patcher for Call of Duty: Modern Warfare 2 (2009), updated for the 2026 64-bit iw4sp.exe.

            Put the executable beside iw4sp.exe, confirm your resolution, and click Apply Fix.
          files: MW2-Ultrawide-Fix.exe
